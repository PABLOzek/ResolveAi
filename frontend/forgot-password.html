<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resolve Aí – Esqueci a senha</title>
  <link rel="icon" type="image/jpeg" href="IMG/logo_resolveai.jpeg" />
  <link rel="stylesheet" href="CSS/style.css" />
  <link rel="stylesheet" href="CSS/login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="CSS/page-transition.css" />
</head>
<body class="auth-body">

  <div class="auth-bg-shape shape-1"></div>
  <div class="auth-bg-shape shape-2"></div>

  <main class="auth-card">
    <div class="logo-wrap">
      <img src="IMG/logo_resolveai.jpeg" alt="Resolve Aí" class="logo-img" />
    </div>

    <div id="stepRequest">
      <h1 class="auth-title">Esqueceu a senha?</h1>
      <p class="auth-subtitle">Sem problemas! Informe seu e-mail e enviaremos um link para redefinição.</p>

      <div class="input-group">
        <label for="resetEmail">E-mail cadastrado</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <input type="email" id="resetEmail" placeholder="seu@email.com" autocomplete="email" />
        </div>
      </div>

      <button class="btn-primary" style="width:100%" onclick="handleForgotPassword()">Enviar link de redefinição</button>
    </div>

    <div id="stepSuccess" style="display:none; text-align:center;">
      <div style="font-size:56px; margin-bottom:16px;">📬</div>
      <h1 class="auth-title">E-mail enviado!</h1>
      <p class="auth-subtitle" style="margin-bottom:28px">Verifique sua caixa de entrada e siga as instruções para redefinir sua senha.</p>
      <button class="btn-primary" style="width:100%" onclick="window.location.href='index.html'">Voltar ao login</button>
    </div>

    <div class="auth-divider"><span>ou</span></div>

    <p class="auth-switch">
      Lembrou a senha?
      <a href="index.html" class="link-accent">Fazer login</a>
    </p>
  </main>

  <script src="JS/auth.js"></script>
  <script src="JS/forgot-password.js"></script>
  <script src="JS/page-transition.js"></script>
</body>
</html>
