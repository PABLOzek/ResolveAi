<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta | Resolve Aí</title><link rel="icon" href="IMG/logo_resolveai.jpeg"><link rel="stylesheet" href="CSS/v1.css"><link rel="stylesheet" href="CSS/api-integration.css"></head><body><main class="auth-layout"><section class="auth-brand-panel"><a href="index.html"><img src="IMG/logo_resolveai.jpeg" alt="Logo Resolve Aí"></a><h1>Uma conta. <span>Dois caminhos.</span></h1><p>Cadastre seus dados para procurar serviços e, se desejar, complemente a conta com um perfil profissional.</p></section><section class="auth-side"><form class="auth-card" id="registerForm"><h2>Criar conta</h2><p>Os dados serão enviados à API e gravados no banco de dados.</p><div class="field"><label for="name">Nome completo</label><input id="name" required maxlength="120"></div><div class="field"><label for="email">E-mail</label><input id="email" type="email" required maxlength="160"></div><div class="field"><label for="cpf">CPF (11 números)</label><input id="cpf" required inputmode="numeric" minlength="11" maxlength="14"></div><div class="field"><label for="phone">Telefone</label><input id="phone" maxlength="25"></div><div class="field"><label for="birth">Data de nascimento (opcional)</label><input id="birth" type="date"></div><label><input type="checkbox" id="wantsProfessional"> Também quero oferecer serviços</label><div id="professionalFields" hidden><div class="field"><label for="city">Cidade</label><input id="city" maxlength="100" placeholder="Ex.: Ceres, GO"></div><div class="field"><label for="bio">Apresentação profissional</label><textarea id="bio" rows="3" maxlength="1500"></textarea></div><div class="field"><label for="photo">Foto de perfil (JPG, PNG ou WEBP, até 3 MB)</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></div><p class="muted">Depois de criar o perfil, cadastre categorias e serviços na <a href="gestao.html">gestão de cadastros</a>.</p></div><div id="registerStatus" class="api-status" hidden></div><button class="button button-primary" type="submit" id="registerSubmit">Criar conta</button><div class="auth-foot"><a href="index.html">Voltar</a></div></form></section></main><script src="JS/api-config.js"></script><script src="JS/register-v1.js"></script></body></html>
